pooledstd_noise:
    bids:
        stat: pooledstd
        desc: noise
    metadata:
        Description: Noise standard deviation estimated by the QSIPrep denoiser, pooled across the input series, in the intensity units of the preprocessed DWI
        Units: arbitrary
    figure:
        vmin: 0
pooledrms_noise:
    bids:
        stat: pooledrms
        desc: noise
    metadata:
        Description: Root mean square of the residual Patch2Self removed in QSIPrep, pooled across the input series, which mixes noise with fit error
        Units: arbitrary
    figure:
        vmin: 0
snr:
    bids:
        stat: snr
    metadata:
        Description: Signal-to-noise ratio of the preprocessed b=0 reference, divided by the pooled QSIPrep noise standard deviation
    figure:
        vmin: 0
tsnr:
    bids:
        stat: tsnr
    metadata:
        Description: Temporal signal-to-noise ratio of the b=0 volumes from QSIPrep
    figure:
        vmin: 0
cnr:
    bids:
        stat: cnr
    metadata:
        Description: Contrast-to-noise ratio from QSIPrep head motion correction
    figure:
        vmin: 0
mean_jacobian:
    bids:
        stat: mean
        desc: jacobian
    metadata:
        Description: Jacobian or least-squares restoration weights QSIPrep applied when correcting susceptibility distortion, averaged over the DWI volumes
mean_rank:
    bids:
        stat: mean
        desc: rank
    metadata:
        Description: Number of principal components the QSIPrep denoiser kept as signal, averaged over the DWI volumes
        Units: count
    figure:
        vmin: 0
mean_rankdensity:
    bids:
        stat: mean
        desc: rankdensity
    metadata:
        Description: Signal rank per mm of kernel radius estimated by dwidenoise2 in QSIPrep, averaged over the DWI volumes
        Units: 1/mm
    figure:
        vmin: 0
magnitude_sdc:
    bids:
        stat: magnitude
        desc: sdc
    metadata:
        Description: Magnitude of the susceptibility distortion correction displacement from QSIPrep, for the first series of the output
        Units: mm
    figure:
        vmin: 0
magnitude_sdcrefinement:
    bids:
        stat: magnitude
        desc: sdcrefinement
    metadata:
        Description: Magnitude of the DRBUDDI refinement of the TOPUP displacement from QSIPrep
        Units: mm
    figure:
        vmin: 0
