# Scalar maps produced by the DIPY FORCE model.
#
# Every key here becomes an input trait on DIPYFORCEReconScalars *and* the name of an
# output on qsirecon.interfaces.dipy.FORCEReconstruction, so the two must agree.
# The uncertainty-<param> and ambiguity-<param> maps are only produced by DIPY 1.12.1
# and later; with DIPY 1.12.0 FORCEReconstruction leaves them undefined and they are
# skipped.
fa:
    bids:
        model: force
        param: fa
    metadata:
        Description: FORCE fractional anisotropy
        Model:
            Description: FORCE (FORward modeling for Complex microstructure Estimation)
            URL: https://doi.org/10.21203/rs.3.rs-8151109/v1
    figure:
        vmin: 0
        vmax: 1
md:
    bids:
        model: force
        param: md
    metadata:
        Description: FORCE mean diffusivity
        Model:
            Description: FORCE (FORward modeling for Complex microstructure Estimation)
            URL: https://doi.org/10.21203/rs.3.rs-8151109/v1
        Units: mm^2/s
rd:
    bids:
        model: force
        param: rd
    metadata:
        Description: FORCE radial diffusivity
        Model:
            Description: FORCE (FORward modeling for Complex microstructure Estimation)
            URL: https://doi.org/10.21203/rs.3.rs-8151109/v1
        Units: mm^2/s
wm_fraction:
    bids:
        model: force
        param: wmfrac
    metadata:
        Description: FORCE white matter signal fraction
        Model:
            Description: FORCE (FORward modeling for Complex microstructure Estimation)
            URL: https://doi.org/10.21203/rs.3.rs-8151109/v1
    figure:
        vmin: 0
        vmax: 1
gm_fraction:
