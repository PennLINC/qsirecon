    figure:
        vmin: 0
        vmax: 1
num_fibers:
    bids:
        model: force
        param: numfibers
    metadata:
        Description: >-
            FORCE number of fiber populations. An integer from 1 to 3 when using the single best
            match, or a weighted average over the retrieved neighbors in posterior mode
        Model:
            Description: FORCE (FORward modeling for Complex microstructure Estimation)
            URL: https://doi.org/10.21203/rs.3.rs-8151109/v1
    figure:
        vmin: 0
        vmax: 3
