name: FODAutoTrack
nodes:

    # Fit the actual GQI model to the data
-   action: reconstruction
    input: qsirecon
    name: dsistudio_gqi
    parameters:
        method: gqi
    qsirecon_suffix: SS3TAutoTrack
    software: DSI Studio

    # Get 3D images of DSI Studio's scalar maps
-   action: export
    input: dsistudio_gqi
    name: gqi_scalars
    qsirecon_suffix: SS3TAutoTrack
    software: DSI Studio

    # Perform registration using the GQI-based QA+ISO images. This creates an
    # internal map.gz that is passed forward, but it is not saved as a derivative here.
-   action: autotrack_registration
    input: dsistudio_gqi
    name: autotrack_gqi_registration
    # qsirecon_suffix: Don't include here - the map.gz is saved by the final
    # SS3T AutoTrack node after it is associated with the model-ss3t FIB.
    software: DSI Studio

    # Select just one shell + b=0 for autotrack
-   action: select_gradients
    input: qsirecon
    name: select_single_shell
    parameters:
        requested_shells:
            - 0
            - highest
        bval_distance_cutoff: 100

    # Do SS3T on the single-shell data
-   action: csd
    software: MRTrix3
    input: select_single_shell
    name: ss3t_csd
    parameters:
        fod:
            algorithm: ss3t
        mtnormalize: true
        response:
            algorithm: dhollander
    qsirecon_suffix: SS3TAutoTrack

-   action: fod_fib_merge
    name: create_fod_fib
    # Merge the SS3T FODs into a DSI Studio FIB and pass through the GQI-derived
    # mapping file so DSI Studio can associate it with the model-ss3t FIB.
    input: autotrack_gqi_registration
    csd_input: ss3t_csd
    qsirecon_suffix: SS3TAutoTrack
    parameters:
        model: ss3t

    # Track bundles with the SS3T FOD FIB. This is the only node that saves the
    # mapping file as a derivative, using model-ss3t in the output name.
-   action: autotrack
    input: create_fod_fib
    name: autotrack_fod
    parameters:
        tolerance: 22,26,30
        track_id: Association,Projection,Commissure,Cerebellum,CranialNerve
        track_voxel_ratio: 2.0
        yield_rate: 1.0e-06
        model: ss3t
    qsirecon_suffix: SS3TAutoTrack
    software: DSI Studio

