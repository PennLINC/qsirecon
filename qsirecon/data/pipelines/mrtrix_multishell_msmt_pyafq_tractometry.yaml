description: Use pyAFQ to perform the Tractometry pipeline, with tractography from
    qsirecon
name: mrtrix_multishell_msmt_pyafq_tractometry
nodes:
-   action: csd
    input: qsirecon
    name: msmt_csd
    parameters:
        fod:
            algorithm: msmt_csd
            max_sh:
            - 8
            - 8
            - 8
        mtnormalize: true
        response:
            algorithm: dhollander
    qsirecon_suffix: MRtrix3
    software: MRTrix3
-   action: tractography
    input: msmt_csd
    name: track_ifod2
    parameters:
        sift2: {}
        tckgen:
            algorithm: iFOD2
            max_length: 250
            min_length: 30
            power: 0.33
            select: 1000000.0
        use_5tt: false
        use_sift2: true
    qsirecon_suffix: MRtrix3
    software: MRTrix3
-   action: pyafq_tractometry
    input: track_ifod2
    name: pyafq_tractometry
    parameters:
        b0_threshold: 50
        bundle_info: null
        clean_rounds: 5
        clip_edges: false
        csd_lambda_: 1
        csd_response: ''
        csd_sh_order_max: ''
        csd_tau: 0.1
        directions: prob
        dist_to_atlas: 4
        dist_to_waypoint: ''
        distance_threshold: 3
        export: all
        filter_by_endpoints: true
        gtol: 0.01
        length_threshold: 4
        mapping_definition: ''
        max_angle: 30.0
        maxlen: 250
        min_sl: 20
        minlen: 50
        n_points: 100
        n_points_bundles: 40
        n_points_indiv: 40
        n_seeds: 1
        nb_points: false
        nb_streamlines: false
        odf_model: CSD
        prob_threshold: 0
        profile_weights: gauss
        random_seeds: false
        refine_reco: false
        reg_subject_spec: power_map
        reg_template_spec: mni_T1
        return_idx: false
        rng: ''
        rng_seed: ''
        robust_tensor_fitting: false
        save_intermediates: ''
        sbv_lims_bundles: '[None, None]'
        sbv_lims_indiv: '[None, None]'
        scalars: '[''dti_fa'', ''dti_md'']'
        seed_mask: ''
        seed_threshold: 0
        stat: mean
        step_size: 0.5
        trx: false
        use_external_tracking: true
        viz_backend_spec: plotly_no_mp4
        volume_opacity_bundles: 0.3
        volume_opacity_indiv: 0.3
    qsirecon_suffix: PYAFQ
    software: pyAFQ
space: T1w
