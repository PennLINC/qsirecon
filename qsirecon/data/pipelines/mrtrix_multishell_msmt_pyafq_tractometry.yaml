description: Use pyAFQ to perform the Tractometry pipeline, with tractography from
    qsirecon
name: mrtrix_multishell_msmt_pyafq_tractometry
nodes:
-   action: csd
    input: qsirecon
    name: msmt_csd
    parameters:
        fod:
            algorithm: msmt_csd
            max_sh:
            - 8
            - 8
            - 8
        mtnormalize: true
        response:
            algorithm: dhollander
    qsirecon_suffix: MRtrix3
    software: MRTrix3
-   action: tractography
    input: msmt_csd
    name: track_ifod2
    parameters:
        sift2: {}
        tckgen:
            algorithm: iFOD2
            max_length: 250
            min_length: 30
            power: 0.33
            select: 1000000.0
        use_5tt: false
        use_sift2: true
    qsirecon_suffix: MRtrix3
    software: MRTrix3
-   action: pyafq_tractometry
    input: track_ifod2
    name: pyafq_tractometry
    parameters:
        export: all
        scalars: '[''dti_fa'', ''dti_md'']'
        use_external_tracking: true
        viz_backend_spec: plotly_no_mp4
    qsirecon_suffix: PYAFQ
    software: pyAFQ
space: T1w
